name: K9 Ventures
description: 'K9 Ventures is a technology-focused Pre-Seed venture capital fund based in Palo Alto,
  California, founded by Manu Kumar (its "Chief Firestarter"). The firm provides the first institutional
  capital to companies at "frighteningly early" stages, backing new core technologies, technology platforms,
  and new markets rather than following a fixed sector thesis. K9 makes only a handful of concentrated
  investments each year, favoring teams building something genuinely new. Notable past portfolio companies
  include Twilio, Lytro, CrowdFlower, and DNAnexus. This profile was surfaced as a portfolio company of
  Foundry Group and added to the API Evangelist network; K9 Ventures does not publish a public API surface.'
